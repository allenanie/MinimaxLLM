[project]
name = "minimaxllm"
version = "0.1.0"
requires-python = ">=3.13"
# Everything the experiments run on; pinned to the shared venv's install (harbor 0.20.0, modal 1.5.3).
# On this box keep using `uv run --no-sync`: the shared venv is managed additively, never synced.
dependencies = ["harbor[modal]==0.20.0"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
# Flat scripts, not a package; harbor comes from the shared venv, not from here.
package = false

[tool.ruff]
# Matches the prevailing style; format/check runs on touched files only (dispatch 002).
line-length = 120
